<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Εταιρίες — Κατάλογος Φαρμακείου</title>
  <meta name="description" content="Όλες οι εταιρίες του καταλόγου φαρμακείου με λογότυπο, πλήθος προϊόντων και προϊόντα με τιμή χονδρικής.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 text-slate-900 antialiased">

  <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-14">
      <a href="index.html" class="flex items-center gap-2 font-bold text-slate-800">
        <span class="text-xl">🏥</span>
        <span class="hidden sm:inline">Κατάλογος Φαρμακείου</span>
      </a>
      <div class="flex items-center gap-1 overflow-x-auto flex-nowrap min-w-0 ml-3">
        <a href="index.html" class="px-3 sm:px-4 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition flex items-center gap-1.5"><span>🧴</span><span>Αντηλιακά</span></a>
        <a href="cosmetics.html" class="px-3 sm:px-4 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition flex items-center gap-1.5"><span>💄</span><span>Καλλυντικά</span></a>
        <a href="seasonal.html" class="px-3 sm:px-4 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition flex items-center gap-1.5"><span>🌴</span><span>Εποχιακά</span></a>
        <a href="vican.html" class="px-3 sm:px-4 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition flex items-center gap-1.5"><span>🏪</span><span>Vican</span></a>
        <a href="brands.html" class="px-3 sm:px-4 py-1.5 rounded-lg text-sm font-bold bg-slate-900 text-white transition flex items-center gap-1.5"><span>🏷️</span><span>Εταιρίες</span></a>
      <a href="market.html" class="px-3 sm:px-4 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition flex items-center gap-1.5">
        <span>📊</span><span>Αγορά</span>
      </a>
      </div>
    </div>
  </nav>

  <header class="bg-gradient-to-br from-slate-700 via-slate-800 to-slate-900 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-10 sm:py-12">
      <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight drop-shadow">Εταιρίες</h1>
      <p class="mt-3 max-w-2xl text-white/90 text-base sm:text-lg" id="brands-summary">Όλες οι εταιρίες του καταλόγου.</p>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 sm:py-10">
    <div class="mb-6 flex flex-col sm:flex-row gap-3 sm:items-center">
      <div class="relative flex-1">
        <input id="brand-search" type="search" placeholder="Αναζήτηση εταιρίας…"
               class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1010.5 18a7.5 7.5 0 006.15-1.35z"/></svg>
      </div>
      <select id="brand-sort" class="text-sm text-slate-700 rounded-xl border border-slate-300 bg-white shadow-sm py-3 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="name">Αλφαβητικά</option>
        <option value="products">Περισσότερα προϊόντα</option>
        <option value="priced">Περισσότερα με τιμή</option>
      </select>
    </div>
    <div id="brand-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-4"></div>
    <p id="brand-empty" class="hidden text-center text-slate-400 py-16">Δεν βρέθηκε εταιρία.</p>
  </main>

  <footer class="mt-16 border-t border-slate-200 bg-white">
    <div class="max-w-7xl mx-auto px-4 py-8 text-sm text-slate-500">
      <p>Λογότυπα από τα επίσημα sites των εταιριών (scripts/fetch-brand-logos.mjs)· όπου δεν υπάρχει, εμφανίζονται τα αρχικά της εταιρίας.</p>
    </div>
  </footer>

  <script src="js/brands.js?v=5"></script>
  <script src="js/brand-logos.js?v=5"></script>
  <script src="js/brand-stats.js?v=5"></script>
  <script src="js/brands-page.js?v=5"></script>
</body>
</html>
